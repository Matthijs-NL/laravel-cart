name: "Run Tests"

on: [push, pull_request]

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                laravel: [9.*, 12.*]
                include:
                    - laravel: 12.*
                      testbench: 10.*
                      pest-plugin-laravel: 3.1.0

                    - laravel: 9.*
                      testbench: 7.*
                      pest-plugin-laravel: 1.4.0

        name: L${{ matrix.laravel }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.4
                  extensions: curl, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, iconv
                  coverage: none

            - name: Install dependencies
              run: |
                  composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest-plugin-laravel:${{ matrix.pest-plugin-laravel }}" --no-interaction --no-update
                  composer update --prefer-stable --prefer-dist --no-interaction
            - name: Execute tests
              run: vendor/bin/pest

